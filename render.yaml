# Render Deployment Configuration for mjr-detail

services:
  # Backend API service
  - type: web
    name: mjr-detail-api
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      cd backend && \
      npm ci && \
      npx prisma generate && \
      npx tsc && \
      npx prisma migrate deploy && \
      npm prune --production
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # External Postgres (Neon). Set this in the Render dashboard:
      # Service -> Environment -> DATABASE_URL = your Neon DIRECT (non-pooled)
      # connection string, including ?sslmode=require. Not committed (has a password).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
      - key: TEXTBEE_API_KEY
        sync: false
